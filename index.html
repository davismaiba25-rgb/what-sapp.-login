<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp Group Login</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right, #25D366, #128C7E);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin: 0;
}

.login-box{
    background:white;
    padding:30px;
    width:300px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#128C7E;
    margin-top: 0;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition: 0.3s;
}

button:hover{
    background:#128C7E;
}

#groupLink{
    display:none;
    text-align:center;
    margin-top:20px;
    animation: slideIn 0.5s ease-in;
}

@keyframes slideIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

a{
    text-decoration:none;
    color:white;
    background:#128C7E;
    padding:10px 15px;
    border-radius:10px;
    display: inline-block;
    transition: 0.3s;
}

a:hover{
    background:#0d6b5e;
}

</style>
</head>

<body>

<div class="login-box">

<h2>WhatsApp Group Login</h2>

<input type="text" id="username" placeholder="Enter Username">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<div id="groupLink">
    <p>Join our WhatsApp Group 👇</p>

    <a href="https://chat.whatsapp.com/" target="_blank">
       Join Group
    </a>
</div>

</div>

<script>

function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username == "admin" && password == "1234"){

        document.getElementById("groupLink").style.display = "block";
        alert("Login Successful ✅");

    }else{

        alert("Wrong Username or Password ❌");
    }
}

</script>

</body>
</html>
